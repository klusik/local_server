name: Python CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  basic:
    uses: ./.github/workflows/basic-checks.yml
    with:
      candidate: ${{ github.sha }}
  full:
    needs: basic
    if: ${{ github.event_name != 'push' }}
    uses: ./.github/workflows/python-checks.yml
    with:
      candidate: ${{ github.sha }}

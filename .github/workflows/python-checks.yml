name: Full Python checks

on:
  workflow_call:
    inputs:
      candidate:
        description: Immutable commit selected by the calling workflow.
        required: true
        type: string

permissions:
  contents: read

jobs:
  unittest:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test tooling
        run: python -m pip install -e '.[dev]'
      - name: Compile Python
        run: python -m compileall -q src tests tools
      - name: Run all headless unit tests
        run: python -m unittest discover -s tests -v

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "local-server-manager"
version = "0.1.0.dev0"
description = "Isolated local web development environments for Windows and macOS"
readme = "README.md"
requires-python = ">=3.14"
authors = [{name = "Rudolf Klusal"}]
dependencies = []
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Win32 (MS Windows)",
  "Environment :: MacOS X",
  "Framework :: Tkinter",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]

[project.scripts]
local-server = "local_server.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
local_server = ["components/package_catalog.json"]

[project.optional-dependencies]
dev = ["ruff==0.14.2", "mypy==1.18.2", "PyYAML==6.0.3", "types-PyYAML==6.0.12.20250915"]

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["packages", ".test-tmp", "test_server"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "D", "ANN"]
# Dynamic JSON/ctypes boundaries may use Any; strict mypy still checks callers.
ignore = ["ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.14"
files = ["src", "tools"]
strict = true
# ctypes Windows APIs are checked against their actual target stubs, on every host.
platform = "win32"
show_error_codes = true
pretty = true
